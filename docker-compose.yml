# Full stack: UI on http://localhost:8080 (proxies /api → backend).
# Ollama must run on the host; containers reach it via host.docker.internal.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - vector_store:/app/vector_store
      - ./data:/app/data
    environment:
      # Inside the container, localhost would not reach Ollama on the host.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      VECTOR_STORE_PATH: /app/vector_store
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  vector_store:
